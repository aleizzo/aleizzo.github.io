baseURL: "https://aleizzo.github.io/"
title: Alessandro Izzo
pagination:
    pagerSize: 20
theme: PaperMod

enableInlineShortcodes: true
enableRobotsTXT: true

taxonomies:
    tag: tags

# Each menu entry becomes a section on the homepage (content/<folder>/).
menu:
    main:
        # Uncomment the three lines below once you have a published paper in content/papers/
        # - name: Published papers
        #   url: papers/
        #   weight: 1
        - name: Working papers
          url: workinprogress/
          weight: 2

params:
    homeTitle: "Alessandro Izzo | Economics Ph.D. Student at Boston College"
    description: "I am an Econ Ph.D. student interested in Labour economics, Cognitive economics, Industrial Organisation, and Political Economy. From Napoli."
    images: ["picture.jpeg"]
    author: Alessandro Izzo
    DateFormat: "January 2006"
    defaultTheme: light
    hideFooter: false
    disableThemeToggle: true
    ShowShareButtons: false
    ShowReadingTime: false
    disableSpecial1stPost: true
    disableAnchoredHeadings: true
    ShowPostNavLinks: false
    ShowBreadCrumbs: false
    ShowCodeCopyButtons: true
    ShowRssButtonInSectionTermList: false
    ShowToc: false
    disableScrollToTop: true
    TocOpen: true
    ShowWordCount: false
    UseHugoToc: true
    comments: false
    math: true
    profileMode:
          enabled: true
          title: "Alessandro Izzo"
          subtitle: "I am an Econ Ph.D. student at <a href='https://www.bc.edu/bc-web/schools/morrissey/departments/economics.html' style='font-weight: bold;'>Boston College</a>.
          I graduated from <a href='https://www.unibocconi.it' style='font-weight: bold;'>Bocconi</a>, and I worked as a predoc at NUS, EUI and Bocconi.
          <br> <br>
          I am interested in Labour economics, Cognitive economics, Industrial Organisation, and Political Economy. From Napoli.
          <br> <br>
          You can find my CV <a href='cv.pdf' style='font-weight: bold;'>here</a>."
          imageUrl: "picture.jpeg"
          imageWidth: 160
          imageHeight: 160
          imageTitle: Alessandro Izzo

    socialIcons:
        - name: Email
          url: mailto:izzoale@bc.edu
        - name: CV
          url: cv.pdf
        - name: Google Scholar
          url: https://scholar.google.com/citations?user=8427WQIAAAAJ&hl=en
        # - name: GitHub
        #   url: https://github.com/aleizzo
        - name: Twitter
          url: https://x.com/aleizzus

    assets:
        favicon: "icons/favicon-blue.png"
        favicon16x16: "favicon-16x16.png"
        favicon32x32: "favicon-32x32.png"
        apple_touch_icon: "icons/apple-touch-blue.png"
        disableHLJS: true
        disableScrollBarStyle: true
    cover:
        hiddenInList: false
        hiddenInSingle: true
    label:
      text: "Alessandro Izzo"
      icon: icons/favicon-blue.svg
      iconHeight: 18

markup:
    goldmark:
        renderer:
            unsafe: true
    highlight:
        guessSyntax: true
        style: autumn
    tableOfContents:
        endLevel: 2
        ordered: false
        startLevel: 2
